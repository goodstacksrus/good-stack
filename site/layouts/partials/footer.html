<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <p class="disclosure">{{ site.Params.affiliate_disclosure }}</p>
      <nav class="footer-nav">
        {{ range site.Menus.footer }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
      <p class="copyright">&copy; {{ now.Year }} {{ site.Title }}</p>
    </div>
  </div>
</footer>
