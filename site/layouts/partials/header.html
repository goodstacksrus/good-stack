<header class="site-header">
  <div class="container">
    <a class="site-logo" href="{{ .Site.Home.RelPermalink }}">
      <svg width="26" height="22" viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="0" y="0"  width="26" height="6" fill="#c8102e"/>
        <rect x="0" y="8"  width="18" height="6" fill="#c8102e" opacity="0.75"/>
        <rect x="0" y="16" width="10" height="6" fill="#c8102e" opacity="0.45"/>
      </svg>
      <div class="logo-text">
        <span class="logo-good">GOOD</span>
        <span class="logo-stack">STACK</span>
      </div>
    </a>
    <button class="nav-toggle" aria-label="メニュー" aria-expanded="false" aria-controls="site-nav">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" aria-hidden="true">
        <rect width="22" height="2" rx="1" fill="currentColor"/>
        <rect y="7" width="22" height="2" rx="1" fill="currentColor"/>
        <rect y="14" width="22" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
    <nav class="site-nav" id="site-nav">
      {{ range site.Menus.main }}
      <a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
<script>
(function(){
  var btn = document.querySelector('.nav-toggle');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function(){
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  });
  nav.addEventListener('click', function(e){
    if (e.target.tagName === 'A') {
      nav.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
<nav class="category-bar">
  <div class="container">
    {{- with .Site.GetPage "section" "articles" }}<a href="{{ .RelPermalink }}">全記事</a>{{ end }}
    {{- range first 6 .Site.Taxonomies.categories.ByCount }}
      {{- with .Page }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end -}}
    {{- end }}
  </div>
</nav>
