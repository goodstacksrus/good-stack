<!DOCTYPE html>
<html lang="ja">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ if site.Params.ga4_id }}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.ga4_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.Params.ga4_id }}');
  </script>
  {{ end }}
</body>
</html>
